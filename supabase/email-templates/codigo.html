<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tu código de acceso</title>
  </head>
  <body style="margin:0;padding:0;background-color:#FBF7F2;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#FBF7F2;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background-color:#FFFFFF;border:1px solid #E4D6C8;border-radius:24px;">
            <tr>
              <td align="center" style="padding:36px 32px 8px 32px;">
                <img src="https://antoniomonterroso.github.io/libro-de-sabores/icons/icon-192.png" width="72" height="72" alt="Libro de Sabores" style="display:block;border-radius:18px;" />
                <p style="margin:16px 0 0 0;font-family:Georgia,'Times New Roman',serif;font-size:26px;line-height:1.2;color:#3B2F2A;">Libro de Sabores</p>
                <p style="margin:6px 0 0 0;font-family:Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#6B5D54;">El recetario de la familia</p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:24px 32px 0 32px;">
                <p style="margin:0;font-family:Georgia,'Times New Roman',serif;font-size:22px;line-height:1.3;color:#3B2F2A;">Tu código de acceso</p>
                <p style="margin:10px 0 0 0;font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#6B5D54;">Escríbelo en la app para entrar. Es de un solo uso y vence en poco tiempo.</p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:24px 32px;">
                <table role="presentation" cellpadding="0" cellspacing="0" style="background-color:#EFD5D0;border:1px solid #B8975A;border-radius:18px;">
                  <tr>
                    <td align="center" style="padding:18px 28px;font-family:Georgia,'Times New Roman',serif;font-size:40px;line-height:1;letter-spacing:10px;color:#3B2F2A;font-weight:bold;">{{ .Token }}</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:0 32px 36px 32px;">
                <p style="margin:0;font-family:Helvetica,Arial,sans-serif;font-size:13px;line-height:1.6;color:#6B5D54;">Si no pediste este código, ignora este correo. Nadie puede entrar sin él.</p>
              </td>
            </tr>
          </table>
          <p style="margin:20px 0 0 0;font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#6B5D54;">Libro de Sabores · recetas que se heredan, se cocinan y se comparten</p>
        </td>
      </tr>
    </table>
  </body>
</html>
